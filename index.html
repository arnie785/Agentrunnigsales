<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Executive Sales Dashboard</title>
  <style>
    :root {
      --bg: #050505;
      --text: #ffffff;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
    }

    .wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--bg);
    }

    .fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--text);
      padding: 24px;
      pointer-events: none;
    }

    .fallback p {
      margin: 0;
      max-width: 520px;
      line-height: 1.5;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe
      src="https://script.google.com/macros/s/AKfycbz6lppCFZDdn77OrXBx59lcWgMfvY-NLjX87BF1_vgyjFS4FrkVMxKpwkQ67-ea7wRj/exec"
      title="Executive Sales Dashboard"
      loading="eager"
      allowfullscreen
      referrerpolicy="no-referrer"
    ></iframe>

    <div class="fallback">
      <p>If the dashboard does not appear, please check the Apps Script deployment and iframe permissions.</p>
    </div>
  </div>
</body>
</html>
