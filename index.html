<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Executive Sales Dashboard</title>
  <style>
    :root {
      --bg: #050505;
      --panel: #0b0b0b;
      --text: #ffffff;
      --muted: #9ca3af;
      --border: rgba(255,255,255,0.08);
      --accent: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }

    .title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .content {
      padding: 16px;
      flex: 1;
    }

    .dashboard-shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      min-height: calc(100vh - 110px);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: rgba(255,255,255,0.02);
    }

    .card .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .card .value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: #111;
      z-index: 1;
    }

    .status {
      font-weight: 700;
    }

    .ok { color: var(--accent); }
    .bad { color: var(--danger); }
    .muted { color: var(--muted); }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 360px;
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 18px;
    }

    .empty-state p {
      margin: 0;
      max-width: 560px;
      line-height: 1.6;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .topbar, .content, .dashboard-shell { padding-left: 12px; padding-right: 12px; }
      .title { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1 class="title">Executive Sales Dashboard</h1>
      <p class="subtitle">Live sales performance view</p>
    </div>

    <div class="content">
      <div class="dashboard-shell">
        <div class="cards" id="cards"></div>
        <div class="table-wrap" id="tableWrap"></div>
      </div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const res = await fetch('?mode=data');
        const data = await res.json();

        renderCards(data.rows);
        renderTable(data.headers, data.rows);
      } catch (err) {
        document.getElementById('tableWrap').innerHTML = `
          <div class="empty-state">
            <div>
              <h2>Failed to load dashboard</h2>
              <p>${err.message}</p>
            </div>
          </div>`;
      }
    }

    function renderCards(rows) {
      const el = document.getElementById('cards');
      const totalRows = rows.length;

      let totalSales = 0;
      let active = 0;

      rows.forEach(r => {
        const sales = Number(r.Sales || r.sales || 0);
        if (!isNaN(sales)) totalSales += sales;

        const status = String(r.Status || r.status || '').toLowerCase();
        if (status === 'active' || status === 'approved') active++;
      });

      el.innerHTML = `
        <div class="card">
          <div class="label">Total Records</div>
          <div class="value">${totalRows}</div>
        </div>
        <div class="card">
          <div class="label">Total Sales</div>
          <div class="value">${totalSales.toLocaleString()}</div>
        </div>
        <div class="card">
          <div class="label">Active / Approved</div>
          <div class="value">${active}</div>
        </div>
      `;
    }

    function renderTable(headers, rows) {
      const wrap = document.getElementById('tableWrap');

      if (!rows || rows.length === 0) {
        wrap.innerHTML = `
          <div class="empty-state">
            <div>
              <h2>No data yet</h2>
              <p>Kapag may laman na ang sheet, lalabas dito ang live records.</p>
            </div>
          </div>`;
        return;
      }

      const head = headers.map(h => `<th>${escapeHtml(String(h))}</th>`).join('');
      const body = rows.map(row => {
        const tds = headers.map(h => {
          const val = row[h];
          return `<td>${formatCell(h, val)}</td>`;
        }).join('');
        return `<tr>${tds}</tr>`;
      }).join('');

      wrap.innerHTML = `
        <table>
          <thead><tr>${head}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

    function formatCell(header, value) {
      const key = String(header).toLowerCase();
      if (key.includes('status')) {
        const v = String(value || '').toLowerCase();
        const cls = v === 'approved' || v === 'active' ? 'ok' : (v ? 'bad' : 'muted');
        return `<span class="status ${cls}">${escapeHtml(String(value ?? ''))}</span>`;
      }
      return escapeHtml(String(value ?? ''));
    }

    function escapeHtml(str) {
      return str
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    loadDashboard();
    setInterval(loadDashboard, 30000); // refresh every 30 sec
  </script>
</body>
</html>
