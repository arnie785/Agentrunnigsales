<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz6lppCFZDdn77OrXBx59lcWgMfvY-NLjX87BF1_vgyjFS4FrkVMxKpwkQ67-ea7wRj/exec?mode=data&callback=handleDashboardData';
const moneyFmt = new Intl.NumberFormat('en-US', {
  style: 'currency',
  currency: 'USD',
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});

const intFmt = new Intl.NumberFormat('en-US');

document.getElementById('reportDate').innerText =
  new Date().toLocaleDateString('en-US', {
    weekday: 'long',
    year: 'numeric',
    month: 'long',
    day: 'numeric'
  });

function setText(id, value) {
  const el = document.getElementById(id);
  if (el) el.innerText = value;
}

function renderMetric(valueId, agentId, metric, type = 'money') {
  if (type === 'percent') {
    setText(valueId, `${Number(metric.value || 0).toFixed(2)}%`);
  } else if (type === 'int') {
    setText(valueId, intFmt.format(Number(metric.value || 0)));
  } else {
    setText(valueId, moneyFmt.format(Number(metric.value || 0)));
  }

  const agentEl = document.getElementById(agentId);
  if (agentEl) {
    agentEl.innerText = metric.agent && metric.agent !== '-' ? `👑 ${metric.agent}` : '-';
  }
}

function renderTableHead(targetId, agents, totalRunningRow) {
  const thead = document.getElementById(targetId);
  if (!thead) return;

  thead.innerHTML = `
    <tr>
      <th class="sticky">Category</th>
      ${agents.map((agent, idx) => `
        <th>
          <div class="agent-rank">
            <div class="rank-circle">${idx + 1}</div>
            <div class="agent-name">${agent}</div>
            <div class="agent-total">${moneyFmt.format(Number(totalRunningRow[agent] || 0))}</div>
          </div>
        </th>
      `).join('')}
    </tr>
  `;
}

function renderTableBody(targetId, rows, agents) {
  const tbody = document.getElementById(targetId);
  if (!tbody) return;

  tbody.innerHTML = rows.map(row => `
    <tr>
      <td class="sticky">${row.label}</td>
      ${agents.map(agent => `<td>${row.values[agent] ?? ''}</td>`).join('')}
    </tr>
  `).join('');
}

function handleDashboardData(data) {
  try {
    const agents = Array.isArray(data.agents) ? data.agents : [];
    const productionRows = Array.isArray(data.productionRows) ? data.productionRows : [];
    const leadRows = Array.isArray(data.leadRows) ? data.leadRows : [];
    const metrics = data.metrics || {};

    setText('teamPremium', moneyFmt.format(Number(metrics.totalTeamPremium || 0)));
    setText('dealsClosed', intFmt.format(Number(metrics.totalDeals || 0)));

    renderMetric('topMec', 'topMecAgent', metrics.topMec || {}, 'money');
    renderMetric('topIndemnity', 'topIndemnityAgent', metrics.topIndemnity || {}, 'money');
    renderMetric('topRunning', 'topRunningAgent', metrics.topRunning || {}, 'money');
    renderMetric('topCross', 'topCrossAgent', metrics.topCross || {}, 'money');
    renderMetric('topDental', 'topDentalAgent', metrics.topDental || {}, 'money');
    renderMetric('topAncillary', 'topAncillaryAgent', metrics.topAncillary || {}, 'percent');

    const totalRunningRow = {};
    const runningRow = productionRows.find(r => r.label === 'Total Running Premium');
    if (runningRow && runningRow.values) {
      agents.forEach(agent => {
        totalRunningRow[agent] = runningRow.values[agent] || '';
      });
    }

    renderTableHead('mainHead', agents, totalRunningRow);
    renderTableBody('mainBody', productionRows, agents);

    renderTableHead('leadHead', agents, totalRunningRow);
    renderTableBody('leadBody', leadRows, agents);
  } catch (err) {
    console.error('Render failed:', err);
  }
}

function loadDashboard() {
  window.handleDashboardData = handleDashboardData;

  const s = document.createElement('script');
  s.src = API_URL + '&callback=handleDashboardData&_=' + Date.now();
  s.onerror = function () {
    console.error('API load failed');
    setText('teamPremium', '$0.00');
    setText('dealsClosed', '0');
  };
  document.body.appendChild(s);
}

loadDashboard();
</script>
